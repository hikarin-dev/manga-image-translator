[package]
name = "shiori-renderer"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Python integration of the commit-pinned Koharu renderer"
publish = false

[lib]
name = "shiori_renderer"
crate-type = ["cdylib", "rlib"]

[dependencies]
koharu-renderer = { workspace = true }
koharu-scene = { workspace = true }
koharu-rasterizer = { workspace = true }
anyhow = { workspace = true }
image = { workspace = true }
imageproc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py39", "anyhow"] }

[workspace]
members = [".", "vendor/*"]
resolver = "3"

[workspace.package]
version = "0.61.2"
edition = "2024"
description = "Manga translation tools"
license = "MIT OR Apache-2.0"
authors = ["Mayo Takanashi <mayo@linux.com>", "Wangchong Zhou <fffonion@gmail.com>"]
readme = "README.md"
homepage = "https://koharu.rs"
repository = "https://github.com/koharu-rs/koharu"
keywords = ["manga", "ocr", "translation", "deep_learning", "computer_vision"]
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.2"
atomicwrites = "0.4.4"
backon = { version = "1.6.0", default-features = false, features = ["std", "tokio-sleep"] }
blake3 = "1.8.7"
bytes = "1.12.1"
criterion = { version = "0.8.2", features = ["html_reports"] }
dirs = "7.0.0"
dunce = "1.0.5"
fast-glob = "1.1.1"
fast_image_resize = { version = "6.1.0", features = ["image", "rayon"] }
flate2 = "1.1.10"
fontique = "0.11.1"
fs4 = "1.1.0"
futures = "0.3.34"
harfrust = "0.13.3"
hashbrown = "0.17.1"
hf-hub = { git = "https://github.com/huggingface/hf-hub", branch = "main" }
hypher = "0.1.7"
icu_normalizer = { version = "2.3.0", default-features = false, features = ["compiled_data"] }
icu_properties = "2.3.0"
icu_segmenter = "2.3.0"
image = "0.25.10"
imageproc = "0.27.0"
imbl = "7.0.2"
jieba-rs = "0.10.3"
koharu-config = { path = "vendor/koharu-config" }
koharu-rasterizer = { path = "vendor/koharu-rasterizer", default-features = false }
koharu-renderer = { path = "vendor/koharu-renderer" }
koharu-runtime = { path = "vendor/koharu-runtime" }
koharu-scene = { path = "vendor/koharu-scene" }
koharu-storage = { path = "vendor/koharu-storage" }
libc = "0.2.189"
libloading = "0.9.0"
memmap2 = "0.9.11"
parking_lot = "0.12.5"
petgraph = "0.8.3"
pollster = "1.0.1"
postcard = { version = "1.1.3", features = ["use-std"] }
rayon = "1.12.0"
reqwest = { version = "0.13.5", features = ["stream", "json", "form", "blocking", "multipart"] }
reqwest-middleware = "0.5.2"
reqwest-retry = "0.9.1"
revision = { version = "0.30.0", features = ["uuid"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
skrifa = "0.47.0"
slotmap = "1.1.1"
smallvec = "1.16.0"
specta = { version = "=2.0.0-rc.25", features = ["derive", "url", "uuid"] }
strum = { version = "0.28.0", features = ["derive"] }
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-rayon = "2.1.0"
toml = "1.1.5"
tracing = "0.1.44"
unicode-bidi = "0.3.18"
uuid = { version = "1.26.0", features = ["v4", "v7", "serde"] }
vello = "0.10.0"
walkdir = "2.5.0"
webp = { version = "0.3.1" }
zip = { version = "8.6.0", features = ["deflate"] }

[profile.dev]
debug = 1

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.koharu-rasterizer]
opt-level = 3
