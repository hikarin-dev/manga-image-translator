[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "shiori-renderer"
version = "0.2.0"
description = "Python integration of the commit-pinned Koharu renderer"
requires-python = ">=3.9"
license = { text = "GPL-3.0-only" }

[tool.maturin]
module-name = "shiori_renderer"
include = [
    { path = "vendor/LICENSE-MIT", format = ["sdist", "wheel"] },
    { path = "vendor/LICENSE-APACHE", format = ["sdist", "wheel"] },
    { path = "UPSTREAM.md", format = ["sdist", "wheel"] },
]
